{% extends 'core/base.html' %}
{% block content %}
<h1>Tarjetas NFC</h1>
<a class="btn btn-primary mb-3" href="{% url 'nfc_create' %}">Nueva tarjeta</a>
<table class="table table-striped">
  <thead><tr><th>ID</th><th>UID</th><th></th></tr></thead>
  <tbody>
  {% for item in items %}
    <tr>
      <td>{{ item.id }}</td>
      <td>{{ item.uid }}</td>
      <td><a class="btn btn-sm btn-danger" href="{% url 'nfc_delete' item.id %}">Eliminar</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="3">Sin tarjetas</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
