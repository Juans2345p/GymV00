<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Gym MVC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  <nav class="mb-4">
    <a class="btn btn-sm btn-outline-info" href="{% url 'top' %}">Top Rachas</a>
    {% if request.session.usuario_id %}
      <span class="me-2">Hola, {{ request.session.usuario_nombre|default:'usuario' }}</span>
      <a class="btn btn-sm btn-outline-primary" href="{% url 'home' %}">Inicio</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'usuario_list' %}">Usuarios</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'mensualidad_list' %}">Mensualidades</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'racha_list' %}">Rachas</a>
      <a class="btn btn-sm btn-outline-secondary" href="{% url 'identificacion_list' %}">Identificaciones</a>
      {% if request.session.is_admin %}
        <a class="btn btn-sm btn-outline-secondary" href="{% url 'nfc_list' %}">NFC</a>
        <a class="btn btn-sm btn-outline-warning" href="{% url 'mqtt_config' %}">MQTT</a>
      {% endif %}
      <a class="btn btn-sm btn-outline-danger" href="{% url 'logout' %}">Salir</a>
    {% else %}
      <a class="btn btn-sm btn-outline-primary" href="{% url 'login' %}">Login</a>
      <a class="btn btn-sm btn-outline-success" href="{% url 'registro' %}">Registro</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
