{% extends 'core/base.html' %}
{% block content %}
<h1>Confirmar eliminación</h1>
<p>¿Eliminar {{ object }}?</p>
<form method="post">
  {% csrf_token %}
  <button class="btn btn-danger" type="submit">Eliminar</button>
  <a class="btn btn-secondary" href="javascript:history.back()">Cancelar</a>
</form>
{% endblock %}
